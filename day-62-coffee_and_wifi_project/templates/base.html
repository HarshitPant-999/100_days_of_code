html lang="en">
    <head>
        {% block head %}
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
            {% block styles %}
            <!-- Bootstrap CSS -->
                {{ bootstrap.load_css() }}
                <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
            {% endblock %}
        {% endblock %}
        <title>Your page title</title>
    </head>
    <body>
        <!-- Your page content -->
        {% block content %}
            {% block scripts %}
            <!-- Optional JavaScript -->
                {{ bootstrap.load_js() }}
            {% endblock %}
        {% endblock %}
    </body>
</html>
